<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080807" />
  <title>TIGER BAR 136 | Menu</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- All page styling is kept in this separate file. -->
  <link rel="stylesheet" href="tiger-bar-136-menu.css" />
</head>
<body>
  <!-- Keyboard accessibility link -->
  <a class="skip" href="#menu">Skip to menu</a>

  <!-- Site header: edit the bar name and small text here. -->
  <header class="site-header">
    <div class="identity" aria-label="Tiger Bar 136">
      <div class="mark"><span>T</span></div>
      <div class="brand-name">
        TIGER BAR 136
        <small>LOUNGE · WHISKEY · VIP KTV</small>
      </div>
    </div>
    <a class="menu-link" href="#menu">Menu ↓</a>
  </header>

  <!-- Introduction -->
  <section class="intro" aria-labelledby="page-title">
    <div>
      <p class="eyebrow">The complete collection</p>
      <h1 id="page-title">TIGER BAR <span>136</span></h1>
      <p class="intro-description">Premium pours, cocktails and more—presented in one uninterrupted menu experience.</p>
    </div>
  </section>

  <!--
    Menu images
    To replace a menu page later, put the new image inside
    the tiger-menu-images folder, then change only its src below.
  -->
  <main class="menu" id="menu">
    <div class="menu-rule"><span>Menu</span></div>

    <section class="menu-pages" aria-label="Tiger Bar 136 full menu">
      <figure class="menu-page" data-page="COVER">
        <img src="tiger-menu-images/page-1.jpg" alt="Tiger Bar 136 menu cover" />
      </figure>

      <figure class="menu-page" data-page="MENU · 01">
        <img src="tiger-menu-images/page-2.jpg" alt="Tiger Bar 136 menu page 1" loading="lazy" />
      </figure>

      <figure class="menu-page" data-page="MENU · 02">
        <img src="tiger-menu-images/page-3.jpg" alt="Tiger Bar 136 menu page 2" loading="lazy" />
      </figure>

      <figure class="menu-page" data-page="MENU · 03">
        <img src="tiger-menu-images/page-4.jpg" alt="Tiger Bar 136 menu page 3" loading="lazy" />
      </figure>

      <figure class="menu-page" data-page="MENU · 04">
        <img src="tiger-menu-images/page-5.jpg" alt="Tiger Bar 136 menu page 4" loading="lazy" />
      </figure>

      <figure class="menu-page" data-page="MENU · 05">
        <img src="tiger-menu-images/page-6.jpg" alt="Tiger Bar 136 menu page 5" loading="lazy" />
      </figure>
    </section>
  </main>

  <footer class="site-footer">Tiger Bar 136 · Thank you for choosing Tiger 136</footer>
</body>
</html>
